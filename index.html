<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Дашборд — Home CRM</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/calendar-dark.css">
</head>
<body>
<aside class="sidebar">
  <div class="logo"><div class="mark"><i data-lucide="home"></i></div><span class="t">Home CRM</span></div>
  <nav class="nav" id="nav"></nav>
  <div class="user-card"><div class="who"><span class="avatar lg" id="me-avatar"></span><div><b id="me-name"></b><span class="small muted" id="me-role"></span></div></div>
    <button class="btn sm" id="logout" title="Выйти"><i data-lucide="log-out"></i><span>Выйти</span></button></div>
</aside>
<div class="content">
  <div class="offline-bar" id="offline-bar" hidden>Связь потеряна. Изменения не сохраняются — идёт переподключение…</div>
  <header class="topbar">
    <div class="search-box"><i data-lucide="search"></i><input id="search-trigger" placeholder="Поиск по задачам, проектам, контактам" readonly aria-label="Поиск"><kbd>Ctrl K</kbd></div>
    <div style="position:relative"><button class="btn primary" id="create-btn"><i data-lucide="plus"></i>Создать</button></div>
    <div class="grow"></div>
    <div class="conn" id="conn" title="Состояние соединения"><span class="dot"></span><span id="conn-text">Онлайн</span></div>
    <div style="position:relative"><button class="icon-btn" id="bell" aria-label="Уведомления"><i data-lucide="bell"></i><span class="badge-dot" id="bell-count" hidden>0</span></button></div>
  </header>
  <main id="view"></main>
</div>
<nav class="bottom-nav" id="bottom-nav"></nav>
<div id="toasts" aria-live="polite"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales/ru.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script type="module" src="js/app.js"></script>
</body></html>
